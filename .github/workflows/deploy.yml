name: Deploy Frontend

on:
  push:
    branches:
      - develop
      - test
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

  deploy:
    name: Deploy to Coolify
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Webhook (Test)
        if: github.ref == 'refs/heads/test'
        run: |
          AUTH_HEADER=()
          if [ -n "${{ secrets.COOLIFY_API_TOKEN }}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")
          fi
          curl -sS --max-time 60 -X GET "${{ secrets.COOLIFY_WEBHOOK_TEST }}" "${AUTH_HEADER[@]}"

      - name: Trigger Coolify Webhook (Main)
        if: github.ref == 'refs/heads/main'
        run: |
          AUTH_HEADER=()
          if [ -n "${{ secrets.COOLIFY_API_TOKEN }}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")
          fi
          curl -sS --max-time 60 -X GET "${{ secrets.COOLIFY_WEBHOOK_MAIN }}" "${AUTH_HEADER[@]}"
