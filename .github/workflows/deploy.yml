name: Deploy Frontend

on:
  push:
    branches:
      - develop
      - test
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

  deploy:
    name: Deploy to Coolify
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Webhook (Test)
        if: github.ref == 'refs/heads/test'
        run: |
          curl -L -X GET "${{ secrets.COOLIFY_WEBHOOK_TEST }}"

      - name: Trigger Coolify Webhook (Main)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -L -X GET "${{ secrets.COOLIFY_WEBHOOK_MAIN }}"
